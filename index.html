// Parse text and detect client-specific instructions
function instrParseText() {
  var text = (document.getElementById('instr-text') || {}).value || '';
  var defaultClient = (document.getElementById('instr-default-client') || {}).value || '';
  var source = (document.getElementById('instr-source') || {}).value || 'email';
  
  if (!text.trim()) return [];
  
  // Get known client names
  var clients = {};
  (DATA.ga4Daily || []).forEach(function(r) { if (r.client_name) clients[r.client_name] = true; });
  (DATA.config || []).forEach(function(r) { if (r.client_name) clients[r.client_name] = true; });
  var clientList = Object.keys(clients).sort(function(a,b) { return b.length - a.length; }); // longest first
  
  // Split text into lines
  var lines = text.split('\n').filter(function(l) { return l.trim().length > 0; });
  
  // Try to detect client names in lines
  var instructions = [];
  var currentClient = defaultClient;
  var currentLines = [];
  
  lines.forEach(function(line) {
    // Check if line starts with or contains a known client name
    var detectedClient = '';
    for (var i = 0; i < clientList.length; i++) {
      var cn = clientList[i];
      // Check case-insensitive match at start of line or after common patterns
      var lowerLine = line.toLowerCase();
      var lowerCn = cn.toLowerCase();
      if (lowerLine.indexOf(lowerCn) !== -1) {
        // Check if it's a "header" line (client name appears early)
        var pos = lowerLine.indexOf(lowerCn);
        if (pos < 20) { // Client name within first 20 chars = header
          detectedClient = cn;
          break;
        }
      }
    }
    
    if (detectedClient && detectedClient !== currentClient) {
      // Flush previous
      if (currentClient && currentLines.length > 0) {
        instructions.push({ client_name: currentClient, text: currentLines.join('\n').trim(), source: source });
      }
      currentClient = detectedClient;
      // Remove client name from the line if it's just the header
      var remainder = line.replace(new RegExp(detectedClient.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i'), '').replace(/^[\s:—–\-,]+/, '').trim();
      currentLines = remainder ? [remainder] : [];
    } else {
      currentLines.push(line.trim());
    }
  });
  
  // Flush last block
  if (currentClient && currentLines.length > 0) {
    instructions.push({ client_name: currentClient, text: currentLines.join('\n').trim(), source: source });
  }
  
  // If no client detected and we have a default, treat everything as one instruction
  if (instructions.length === 0 && defaultClient && text.trim()) {
    instructions.push({ client_name: defaultClient, text: text.trim(), source: source });
  }
  
  // If still nothing, try to split by bullet points/numbers as separate instructions with default
  if (instructions.length === 0 && text.trim()) {
    // No client detected at all
    instructions.push({ client_name: '⚠️ ' + (LANG === 'fr' ? 'Client non détecté' : 'Client not detected'), text: text.trim(), source: source, noClient: true });
  }
  
  return instructions;
}

function instrPreview() {
  var instructions = instrParseText();
  var container = document.getElementById('instr-preview');
  if (!container) return;
  
  if (instructions.length === 0) {
    container.innerHTML = '<div style="color:#94a3b8;font-size:13px;text-align:center;padding:20px">' + t('dInstrEmpty') + '</div>';
    return;
  }
  
  var html = '<div style="font-size:13px;font-weight:600;margin-bottom:8px;color:#16213E">' + t('dInstrPreviewTitle') + ' (' + instructions.length + ')</div>';
  instructions.forEach(function(inst, i) {
    var hasError = inst.noClient;
    html += '<div style="background:' + (hasError ? '#fef2f2;border-color:#fca5a5' : '#f0f9ff;border-color:#bae6fd') + ';border:1px solid;border-radius:8px;padding:10px 12px;margin-bottom:6px">';
    html += '<div style="font-weight:600;font-size:12px;color:' + (hasError ? '#dc2626' : '#0c4a6e') + '">📋 ' + inst.client_name + '</div>';
    html += '<div style="font-size:12px;color:#475569;margin-top:4px;white-space:pre-wrap">' + inst.text.substring(0, 200) + (inst.text.length > 200 ? '…' : '') + '</div>';
    html += '</div>';
  });
  
  container.innerHTML = html;
}

function instrSave() {
  var instructions = instrParseText();
  // Filter out undetected
  var valid = instructions.filter(function(i) { return !i.noClient; });
  
  if (valid.length === 0) {
    var statusEl = document.getElementById('instr-status');
    if (statusEl) {
      statusEl.style.display = 'block';
      statusEl.style.background = '#fef2f2';
      statusEl.style.color = '#dc2626';
      statusEl.textContent = LANG === 'fr' ? '⚠️ Sélectionnez un client par défaut ou vérifiez que le texte contient des noms de clients connus' : '⚠️ Select a default client or ensure the text contains known client names';
    }
    return;
  }
  
  var statusEl = document.getElementById('instr-status');
  if (statusEl) {
    statusEl.style.display = 'block';
    statusEl.style.background = '#f0f9ff';
    statusEl.style.color = '#0c4a6e';
    statusEl.textContent = LANG === 'fr' ? '⏳ Enregistrement...' : '⏳ Saving...';
  }
  
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.error) {
        if (statusEl) { statusEl.style.background = '#fef2f2'; statusEl.style.color = '#dc2626'; statusEl.textContent = '❌ ' + result.error; }
      } else {
        if (statusEl) { statusEl.style.background = '#f0fdf4'; statusEl.style.color = '#16a34a'; statusEl.textContent = '✅ ' + result.count + (LANG === 'fr' ? ' consigne(s) enregistrée(s)' : ' instruction(s) saved'); }
        // Reload instructions
        google.script.run.withSuccessHandler(function(instructions) {
          window._clientInstructions = instructions || [];
          setTimeout(function() {
            document.getElementById('instr-modal').classList.remove('show');
            renderDecisions();
          }, 1200);
        }).getClientInstructions(SESSION_TOKEN);
      }
    })
    .withFailureHandler(function(err) {
      if (statusEl) { statusEl.style.background = '#fef2f2'; statusEl.style.color = '#dc2626'; statusEl.textContent = '❌ ' + err.message; }
    })
    .saveClientInstructions(SESSION_TOKEN, valid);
}

// ═══ CSV EXPORT ═══
function exportCSV(rows, columns, filename) {
  var csv = columns.map(function(c) { return '"' + c.label + '"'; }).join(',') + '\n';
  rows.forEach(function(r) {
    csv += columns.map(function(c) {
      var v = typeof c.fn === 'function' ? c.fn(r) : (r[c.key] || '');
      return '"' + String(v).replace(/"/g, '""') + '"';
    }).join(',') + '\n';
  });
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = (filename || 'export') + '.csv';
  link.click();
}

function exportGA4Pages() {
  var pages = ga4FilterData(DATA.ga4LandingPages);
  var filter = document.getElementById('ga4-lp-filter');
  var chFilter = filter ? filter.value : '';
  if (chFilter) {
    pages = pages.filter(function(r) { return (r.channel_group || '(Other)') === chFilter; });
  }
  // Aggregate by page (same logic as renderGA4PagesTable)
  var byPage = {};
  pages.forEach(function(r) {
    var p = r.landing_page || '/';
    if (!byPage[p]) byPage[p] = { sessions: 0, users: 0, conv: 0, rev: 0, bounceW: 0, engW: 0, timeW: 0, w: 0 };
    var s = Number(r.sessions) || 0;
    var b = byPage[p];
    b.sessions += s; b.users += Number(r.users) || 0;
    b.conv += Number(r.conversions) || 0; b.rev += Number(r.event_revenue) || 0;
    b.bounceW += (Number(r.bounce_rate) || 0) * s;
    b.engW += (Number(r.engagement_rate) || 0) * s;
    b.timeW += (Number(r.avg_engagement_time) || 0) * s;
    b.w += s;
  });
  var pageList = Object.keys(byPage).sort(function(a,b) { return byPage[b].sessions - byPage[a].sessions; });
  var rows = pageList.map(function(p) {
    var b = byPage[p];
    return {
      landing_page: p,
      sessions: b.sessions,
      users: b.users,
      engagement_rate: b.w > 0 ? (b.engW / b.w * 100).toFixed(1) + '%' : '0%',
      bounce_rate: b.w > 0 ? (b.bounceW / b.w * 100).toFixed(1) + '%' : '0%',
      avg_time: b.w > 0 ? Math.round(b.timeW / b.w) : 0,
      conversions: b.conv,
      revenue: b.rev > 0 ? b.rev.toFixed(2) : '0'
    };
  });
  var suffix = chFilter ? '_' + chFilter.replace(/\s+/g, '_') : '_all';
  exportCSV(rows, [
    { label: 'Landing Page', key: 'landing_page' },
    { label: 'Sessions', key: 'sessions' },
    { label: 'Users', key: 'users' },
    { label: 'Engagement Rate', key: 'engagement_rate' },
    { label: 'Bounce Rate', key: 'bounce_rate' },
    { label: 'Avg Time (s)', key: 'avg_time' },
    { label: 'Conversions', key: 'conversions' },
    { label: 'Revenue', key: 'revenue' }
  ], 'ga4_landing_pages' + suffix);
}

function exportPage() {
  var content = document.getElementById('content');
  var origMaxW = content.style.maxWidth;
  content.style.maxWidth = '1100px';
  
  setTimeout(function() {
    html2canvas(content, { 
      scale: 3,
      backgroundColor: '#f1f5f9',
      width: 1100,
      windowWidth: 1200,
      useCORS: true,
      logging: false
    }).then(function(canvas) {
      content.style.maxWidth = origMaxW;
      
      // Branded wrapper
      var wrapper = document.createElement('canvas');
      var ctx = wrapper.getContext('2d');
      var pad = 60;
      wrapper.width = canvas.width + pad * 2;
      wrapper.height = canvas.height + pad * 2 + 80;
      
      // White background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, wrapper.width, wrapper.height);
      
      // Header bar
      ctx.fillStyle = '#16213E';
      ctx.fillRect(0, 0, wrapper.width, 70);
      ctx.font = 'bold 28px -apple-system, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('📊 Dr.Marketing — ' + (document.getElementById('page-title').textContent || ''), pad, 45);
      
      // Subtitle with date & filter
      ctx.font = '16px -apple-system, sans-serif';
      ctx.fillStyle = '#94a3b8';
      var dateStr = new Date().toLocaleDateString(LANG === 'fr' ? 'fr-FR' : 'en-AU', { year: 'numeric', month: 'long', day: 'numeric' });
      ctx.fillText(dateStr + (currentFilter ? ' — ' + currentFilter : ''), pad, 95);
      
      // Content
      ctx.drawImage(canvas, pad, 110);
      
      // Footer
      ctx.fillStyle = '#e5e7eb';
      ctx.fillRect(0, wrapper.height - 35, wrapper.width, 35);
      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('Generated by Dr.Marketing MCC Dashboard — ' + dateStr, pad, wrapper.height - 12);
      
      // Download
      var link = document.createElement('a');
      link.download = 'DrMarketing-' + currentPage + '-' + (currentFilter || 'all') + '-' + new Date().toISOString().split('T')[0] + '.png';
      link.href = wrapper.toDataURL('image/png');
      link.click();
    });
  }, 50);
}
