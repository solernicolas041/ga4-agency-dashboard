// ═══ PAGE: TRACKING ═══
function renderTracking() {
  var actions = (DATA.convActions || []).slice();
  var daily = (DATA.convDaily || []).slice();
  var alerts = (DATA.convAlerts || []).slice();
  
  // Apply account filter only (NOT date filter — tracking = snapshot)
  if (currentFilter) {
    actions = actions.filter(function(r) { return r.client_name === currentFilter; });
    daily = daily.filter(function(r) { return r.client_name === currentFilter; });
    alerts = alerts.filter(function(r) { return r.client_name === currentFilter; });
  }
  
  // No data state
  if (actions.length === 0 && alerts.length === 0) {
    document.getElementById('content').innerHTML = '<div class="chart-card"><div class="chart-title">' + t('trackNoData') + '</div><div style="padding:20px;font-size:13px;color:#64748b;line-height:1.6"><p><strong>Script #13 (Conv Tracking Monitor)</strong> hasn\'t run yet or returned no data for this account.</p><ol style="margin:8px 0 0 20px"><li>Install Script #13 at MCC level in Google Ads Scripts</li><li>Run it once manually</li><li>It creates: Conv_Actions, Conv_Daily, Conv_Alerts</li></ol><p style="margin-top:12px;font-size:11px;color:#94a3b8">If the script ran but this account shows no data, the account may have no conversion actions configured.</p></div></div>';
    return;
  }
  
  // ═══ BUILD ACTION HEALTH MAP ═══
  // Merge daily volume into actions + alert status
  var alertMap = {};  // action_name → {type, severity, description}
  alerts.forEach(function(a) {
    var key = (a.client_name || '') + '||' + (a.action_name || '');
    if (!alertMap[key] || alertPriority(a.alert_type) < alertPriority(alertMap[key].alert_type)) {
      alertMap[key] = a;
    }
  });
  
  function alertPriority(type) {
    var p = { 'DEAD': 0, 'ERROR': 1, 'DROP': 2, 'SPIKE': 3, 'ZOMBIE': 4, 'CONFIG': 5 };
    return p[(type||'').toUpperCase()] !== undefined ? p[(type||'').toUpperCase()] : 9;
  }
  
  // Compute 7-day and 30-day volume per action
  var volumeMap = {};  // client||action → { d7: X, d30: Y, trend: [] }
  daily.forEach(function(r) {
    var key = (r.client_name || '') + '||' + (r.action_name || '');
    if (!volumeMap[key]) volumeMap[key] = { d7: 0, d30: 0, days: {} };
    var conv = Number(r.conversions) || 0;
    volumeMap[key].d30 += conv;
    volumeMap[key].days[r.date] = (volumeMap[key].days[r.date] || 0) + conv;
  });
  // Calculate 7-day totals
  var allDates = {};
  daily.forEach(function(r) { allDates[r.date] = true; });
  var sortedDates = Object.keys(allDates).sort().reverse();
  var last7dates = sortedDates.slice(0, 7);
  Object.keys(volumeMap).forEach(function(key) {
    var v = volumeMap[key];
    last7dates.forEach(function(d) { v.d7 += (v.days[d] || 0); });
  });
  
  // ═══ BUILD ENRICHED ACTIONS LIST ═══
  var enriched = actions.map(function(a) {
    var key = (a.client_name || '') + '||' + (a.action_name || '');
    var alert = alertMap[key] || null;
    var vol = volumeMap[key] || { d7: 0, d30: 0 };
    var status = 'healthy';
    var statusIcon = '🟢';
    var statusLabel = 'Healthy';
    if (alert) {
      var at = (alert.alert_type || '').toUpperCase();
      if (at === 'DEAD' || at === 'ERROR') { status = 'broken'; statusIcon = '🔴'; statusLabel = at; }
      else if (at === 'DROP') { status = 'warning'; statusIcon = '🟠'; statusLabel = 'DROP'; }
      else if (at === 'ZOMBIE') { status = 'warning'; statusIcon = '🟡'; statusLabel = 'ZOMBIE'; }
      else if (at === 'SPIKE') { status = 'info'; statusIcon = '🟢'; statusLabel = 'SPIKE'; }
      else if (at === 'CONFIG') { status = 'config'; statusIcon = 'ℹ️'; statusLabel = 'CONFIG'; }
    }
    return {
      client: a.client_name, name: a.action_name, type: a.type, category: a.category,
      primary: a.primary, counting: a.counting_type, attribution: a.attribution_model,
      defaultVal: a.default_value, valueType: a.value_type, actionStatus: a.status,
      status: status, statusIcon: statusIcon, statusLabel: statusLabel,
      d7: vol.d7, d30: vol.d30, alert: alert,
      alertDesc: alert ? (alert.description || '') : ''
    };
  });
  
  // Sort: broken first, then warning, then config, then healthy
  var statusOrder = { broken: 0, duplicate: 1, warning: 2, config: 3, info: 4, healthy: 5 };
  enriched.sort(function(a, b) {
    var sa = statusOrder[a.status] !== undefined ? statusOrder[a.status] : 9;
    var sb = statusOrder[b.status] !== undefined ? statusOrder[b.status] : 9;
    if (sa !== sb) return sa - sb;
    return (a.client || '').localeCompare(b.client || '');
  });
  
  // ═══ DETECT DUPLICATE PRIMARY ACTIONS ═══
  // Smart grouping: category field → keyword extraction from name → skip
  var dupMap = {}; // 'client||goalCategory' → [action1, action2, ...]
  enriched.forEach(function(a) {
    if (a.primary !== 'PRIMARY') return;
    // Priority: category field → keyword extraction → skip (don't group by type alone)
    var goalCat = a.category || extractGoalKeyword(a.name) || null;
    if (!goalCat) return; // can't determine goal — skip to avoid false positives
    var key = (a.client || '') + '||' + goalCat;
    if (!dupMap[key]) dupMap[key] = [];
    dupMap[key].push(a);
  });
  var duplicates = [];
  Object.keys(dupMap).forEach(function(key) {
    if (dupMap[key].length < 2) return;
    var acts = dupMap[key];
    var convValues = acts.map(function(a) { return a.d30; }).sort(function(a,b) { return b - a; });
    var total30 = convValues.reduce(function(s,v) { return s + v; }, 0);
    var overcount = total30 - convValues[0];
    duplicates.push({
      client: acts[0].client,
      category: acts[0].category || extractGoalKeyword(acts[0].name) || 'unknown',
      actions: acts,
      totalConv: total30,
      overcount: overcount
    });
  });
  
  // Mark duplicate actions in enriched list
  duplicates.forEach(function(dup) {
    dup.actions.forEach(function(a) {
      if (a.status === 'healthy' || a.status === 'info') {
        a.status = 'duplicate';
        a.statusIcon = '🔵';
        a.statusLabel = 'DUPLICATE';
        a.alertDesc = 'Duplicate PRIMARY: ' + dup.actions.length + ' primary actions for "' + dup.category + '". Est. overcount: ~' + fmt(dup.overcount) + ' conv/30d.';
      }
    });
  });
  
  // ═══ SCORECARDS ═══
  var primaryActions = enriched.filter(function(a) { return a.primary === 'PRIMARY'; });
  var healthy = enriched.filter(function(a) { return a.status === 'healthy'; }).length;
  var warnings = enriched.filter(function(a) { return a.status === 'warning' || a.status === 'config'; }).length;
  var broken = enriched.filter(function(a) { return a.status === 'broken'; }).length;
  var dupCount = duplicates.length;
  
  var html = '<div class="scorecards">';
  html += scorecard(t('trackHealthy'), healthy, C.green);
  html += scorecard(t('trackWarning'), warnings, C.orange);
  html += scorecard(t('trackBroken'), broken, C.red);
  html += scorecard(t('trackDuplicates') || '⚠️ Duplicates', dupCount, dupCount > 0 ? C.purple : C.blue);
  html += scorecard(t('trackActions'), enriched.length, C.blue);
  html += '</div>';
  
  // ═══ DUPLICATE ALERT BANNER ═══
  if (duplicates.length > 0) {
    html += '<div style="background:linear-gradient(135deg,#fef3c7,#fde68a);border:2px solid #f59e0b;border-radius:10px;padding:16px 20px;margin-bottom:16px">';
    html += '<div style="font-weight:700;font-size:15px;color:#92400e;margin-bottom:8px">⚠️ ' + t('trackDupTitle') + '</div>';
    duplicates.forEach(function(dup) {
      html += '<div style="background:#fff;border-radius:8px;padding:12px 16px;margin-bottom:8px;border-left:4px solid #f59e0b">';
      html += '<div style="font-weight:600;font-size:13px;color:#1e293b">' + dup.client + ' — Goal: <span style="color:#7c3aed">' + dup.category + '</span></div>';
      html += '<div style="font-size:12px;color:#64748b;margin:6px 0">' + dup.actions.length + ' PRIMARY actions counting simultaneously:</div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">';
      dup.actions.forEach(function(a) {
        html += '<span style="background:#ede9fe;color:#5b21b6;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600">' + a.name + ' <span style="color:#7c3aed">(' + fmt(a.d30) + ' conv/30d)</span></span>';
      });
      html += '</div>';
      if (dup.overcount > 0) {
        html += '<div style="font-size:12px;color:#dc2626;font-weight:600">📊 Est. double-count: ~' + fmt(dup.overcount) + ' conversions/30d</div>';
      }
      html += '<div style="font-size:11px;color:#64748b;margin-top:6px">💡 ' + t('trackDupFix') + '</div>';
      html += '</div>';
    });
    html += '</div>';
  }
  
  // ═══ MAIN TABLE: ALL ACTIONS WITH STATUS ═══
  html += '<div class="chart-card"><div class="chart-title">' + t('trackConvActions') + '</div>';
  html += '<table class="data-table"><thead><tr>';
  html += '<th>Status</th><th>' + t('thAccount') + '</th><th>' + t('thActionName') + '</th>';
  html += '<th>' + t('thPrimary') + '</th><th>' + t('thActionType') + '</th>';
  html += '<th>7d Conv</th><th>30d Conv</th>';
  html += '<th>' + t('thCounting') + '</th><th>' + t('thAttribution') + '</th>';
  html += '<th>' + t('thValueType') + '</th>';
  html += '<th>Alert</th>';
  html += '</tr></thead><tbody>';
  
  enriched.forEach(function(a) {
    var rowBg = a.status === 'broken' ? '#fef2f2' : a.status === 'duplicate' ? '#f5f3ff' : a.status === 'warning' ? '#fffbeb' : a.status === 'config' ? '#f0f9ff' : '';
    var isPrimary = a.primary === 'PRIMARY';
    var goalBadge = isPrimary 
      ? '<span style="background:#dbeafe;color:#1e40af;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600">PRIMARY</span>' 
      : '<span style="background:#f1f5f9;color:#94a3b8;padding:2px 6px;border-radius:4px;font-size:10px">SECONDARY</span>';
    
    // Volume styling: bold green if active, red if zero for primary
    var d7style = '';
    if (a.d7 === 0 && isPrimary) d7style = 'color:#dc2626;font-weight:600';
    else if (a.d7 > 0) d7style = 'color:#16a34a;font-weight:600';
    
    var d30style = a.d30 > 0 ? 'color:#16a34a' : (isPrimary ? 'color:#dc2626' : 'color:#94a3b8');
    
    // Alert column
    var alertCell = '—';
    if (a.alertDesc) {
      var truncDesc = a.alertDesc.length > 80 ? a.alertDesc.substring(0, 80) + '…' : a.alertDesc;
      alertCell = '<span title="' + a.alertDesc.replace(/"/g, '&quot;') + '">' + a.statusIcon + ' ' + truncDesc + '</span>';
    } else if (a.status === 'healthy') {
      alertCell = '<span style="color:#16a34a">✓</span>';
    }
    
    html += '<tr style="background:' + rowBg + '">';
    html += '<td style="text-align:center;font-size:16px" title="' + a.statusLabel + '">' + a.statusIcon + '</td>';
    html += '<td style="font-size:12px">' + (a.client || '—') + '</td>';
    html += '<td style="font-weight:600;font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis">' + (a.name || '—') + '</td>';
    html += '<td>' + goalBadge + '</td>';
    html += '<td style="font-size:11px">' + (a.type || '—') + '</td>';
    html += '<td style="' + d7style + '">' + fmt(a.d7, 0) + '</td>';
    html += '<td style="' + d30style + '">' + fmt(a.d30, 0) + '</td>';
    html += '<td style="font-size:10px">' + (a.counting || '—') + '</td>';
    html += '<td style="font-size:10px">' + (a.attribution || '—') + '</td>';
    html += '<td style="font-size:10px">' + (a.valueType || '—') + '</td>';
    html += '<td style="font-size:11px;max-width:250px">' + alertCell + '</td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  
  // ═══ ALERT HISTORY (if alerts exist) ═══
  if (alerts.length > 0) {
    var alertOrder = { 'DEAD': 0, 'DROP': 1, 'ZOMBIE': 2, 'SPIKE': 3, 'CONFIG': 4, 'ERROR': 5 };
    alerts.sort(function(a, b) {
      var oa = alertOrder[(a.alert_type||'').toUpperCase()] || 9;
      var ob = alertOrder[(b.alert_type||'').toUpperCase()] || 9;
      return oa !== ob ? oa - ob : (b.date||'').localeCompare(a.date||'');
    });
    
    html += '<div class="chart-card"><div class="chart-title">' + t('trackAlertLog') + '</div>';
    html += '<table class="data-table"><thead><tr>';
    html += '<th>' + t('thDate') + '</th><th>' + t('thAccount') + '</th>';
    html += '<th>' + t('thAlertType') + '</th><th>' + t('thActionName') + '</th>';
    html += '<th>' + t('thDescription') + '</th><th>' + t('thCurrent') + '</th><th>' + t('thExpected') + '</th>';
    html += '</tr></thead><tbody>';
    alerts.slice(0, 50).forEach(function(a) {
      var sev = a.severity || '';
      var rowBg = sev === '🔴' ? '#fef2f2' : sev === '🟠' ? '#fff7ed' : sev === '🟡' ? '#fefce8' : sev === '🟢' ? '#f0fdf4' : '#f8fafc';
      html += '<tr style="background:' + rowBg + '">';
      html += '<td style="font-size:11px">' + (a.date || '—').substring(0,10) + '</td>';
      html += '<td style="font-size:12px">' + (a.client_name || '—') + '</td>';
      html += '<td><strong>' + sev + ' ' + (a.alert_type || '') + '</strong></td>';
      html += '<td style="font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis">' + (a.action_name || '—') + '</td>';
      html += '<td style="font-size:11px;max-width:300px">' + (a.description || '—') + '</td>';
      html += '<td>' + (a.current_value || '—') + '</td>';
      html += '<td>' + (a.expected_value || '—') + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table>';
    if (alerts.length > 50) html += '<div style="padding:8px;font-size:11px;color:#94a3b8;text-align:center">Showing 50 / ' + alerts.length + '</div>';
    html += '</div>';
  }
  
  // ═══ VOLUME CHART (last 7 days, primary actions only) ═══
  var primaryDaily = {};
  daily.forEach(function(r) {
    // Only chart primary actions
    var matchAction = actions.find(function(a) { return a.client_name === r.client_name && a.action_name === r.action_name && a.primary === 'PRIMARY'; });
    if (!matchAction) return;
    var key = r.client_name + ' — ' + r.action_name;
    if (!primaryDaily[key]) primaryDaily[key] = {};
    primaryDaily[key][r.date] = (primaryDaily[key][r.date] || 0) + (Number(r.conversions) || 0);
  });
  
  var chartDates = last7dates.slice().reverse();  // oldest first for chart
  if (chartDates.length > 0 && Object.keys(primaryDaily).length > 0) {
    html += '<div class="chart-card"><div class="chart-title">' + t('trackVolume') + ' — Primary only</div>';
    html += '<div style="height:' + Math.min(400, Object.keys(primaryDaily).length * 40 + 80) + 'px"><canvas id="chart-track-vol"></canvas></div></div>';
  }
  
  document.getElementById('content').innerHTML = html;
  
  // ═══ DRAW VOLUME CHART ═══
  if (chartDates.length > 0 && Object.keys(primaryDaily).length > 0) {
    var chartColors = ['#3b82f6','#E94560','#10b981','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#06b6d4'];
    var datasets = [];
    var idx = 0;
    Object.keys(primaryDaily).sort().forEach(function(key) {
      var dayMap = primaryDaily[key];
      var vals = chartDates.map(function(d) { return dayMap[d] || 0; });
      var color = chartColors[idx % chartColors.length];
      datasets.push({ label: key, data: vals, borderColor: color, backgroundColor: color + '20', fill: false, tension: 0.3, pointRadius: 3, borderWidth: 2 });
      idx++;
    });
    var shortDates = chartDates.map(function(d) { return d.substring(5); });
    var canvas = document.getElementById('chart-track-vol');
    if (canvas) {
      createChart('chart-track-vol', { type: 'line', data: { labels: shortDates, datasets: datasets }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 }, boxWidth: 12 } } }, scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } } });
    }
  }
}


// ═══ PAGE: CLIENT PMAX (simplified) ═══
function renderClientPmax() {
  // Use filterData — applies both client + date filters, then only campaign_summary for KPIs
  var insightsAll = pmaxDateClean(filterData(DATA.pmaxInsights || []));
  var insights = insightsAll.filter(function(r) { return r.metric_type === 'campaign_summary'; });

  var channels = pmaxDateClean(filterData(DATA.pmaxChannels || []));
  var products = pmaxDateClean(filterData(DATA.pmaxProducts || []));
  
  // Apply account filter
  if (currentFilter) {
    channels = channels.filter(function(r) { return r.client_name === currentFilter; });
    products = products.filter(function(r) { return r.client_name === currentFilter; });
  }
  
  // No PMax data at all
  if (insights.length === 0 && channels.length === 0 && products.length === 0) {
    document.getElementById('content').innerHTML = '<div class="chart-card"><div class="chart-title">🚀 ' + t('cpNoData') + '</div><div style="padding:30px;text-align:center;color:#64748b">No Performance Max campaigns found for this account.</div></div>';
    return;
  }
  
  var html = '';
  
  // ═══ SCORECARDS from PMax Insights ═══
  if (insights.length > 0) {
    var ts = sum(insights, 'cost'), tc = sum(insights, 'conversions'), tv = sum(insights, 'conv_value');
    var ti = sum(insights, 'impressions'), tk = sum(insights, 'clicks');
    html += '<div class="scorecards">';
    html += scorecard(t('pmaxSpend'), fmtCur(ts), C.primary);
    html += scorecard(t('conversions'), fmt(tc, 1), C.blue);
    html += scorecard(t('thROAS'), fmt(ts > 0 ? tv / ts : 0, 2) + 'x', C.green);
    html += scorecard(t('thClicks'), fmt(tk), C.purple);
    html += '</div>';
  }
  
  // ═══ CAMPAIGN TABLE (from insights, grouped by campaign) ═══
  if (insights.length > 0) {
    var byCamp = {};
    insights.forEach(function(r) {
      var key = (r.client_name || '') + '||' + (r.campaign_name || '');
      if (!byCamp[key]) byCamp[key] = { name: r.campaign_name, client: r.client_name, cost: 0, conv: 0, value: 0, clicks: 0, impr: 0 };
      byCamp[key].cost += Number(r.cost) || 0;
      byCamp[key].conv += Number(r.conversions) || 0;
      byCamp[key].value += Number(r.conv_value) || 0;
      byCamp[key].clicks += Number(r.clicks) || 0;
      byCamp[key].impr += Number(r.impressions) || 0;
    });
    var camps = Object.keys(byCamp).map(function(k) { return byCamp[k]; }).sort(function(a, b) { return b.cost - a.cost; });
    
    html += '<div class="chart-card"><div class="chart-title">' + t('cpCampaigns') + '</div>';
    html += '<table class="data-table"><thead><tr>';
    if (!currentFilter) html += '<th>' + t('thAccount') + '</th>';
    html += '<th>' + t('thCampaign') + '</th><th class="num">' + t('thSpend') + '</th><th class="num">' + t('thClicks') + '</th><th class="num">' + t('thConv') + '</th><th class="num">' + t('thROAS') + '</th><th class="num">' + t('thCPA') + '</th></tr></thead><tbody>';
    camps.forEach(function(c) {
      var roas = c.cost > 0 ? c.value / c.cost : 0;
      var cpa = c.conv > 0 ? c.cost / c.conv : 0;
      var badge = roas >= 3 ? 'green' : roas >= 1 ? 'yellow' : 'red';
      html += '<tr>';
      if (!currentFilter) html += '<td>' + c.client + '</td>';
      html += '<td style="font-weight:600">' + (c.name || '—').substring(0, 35) + '</td>';
      html += '<td class="num">' + fmtCur(c.cost) + '</td>';
      html += '<td class="num">' + fmt(c.clicks) + '</td>';
      html += '<td class="num">' + fmt(c.conv, 1) + '</td>';
      html += '<td class="num"><span class="badge ' + badge + '">' + fmt(roas, 2) + 'x</span></td>';
      html += '<td class="num">' + fmtCur(cpa) + '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }
  
  // ═══ CHANNEL BREAKDOWN (from PMax_Channels) ═══
  // Skip if all channels are "Mixed" (useless data)
  var uniqueChannels = {};
  channels.forEach(function(r) { uniqueChannels[r.channel] = true; });
  var channelNames = Object.keys(uniqueChannels);
  var hasRealChannels = channelNames.length > 1 || (channelNames.length === 1 && channelNames[0] !== 'Mixed');
  
  if (hasRealChannels && channels.length > 0) {
    var byCh = {};
    channels.forEach(function(r) {
      var ch = r.channel || 'Other';
      if (!byCh[ch]) byCh[ch] = { cost: 0, clicks: 0, conv: 0, value: 0 };
      byCh[ch].cost += Number(r.cost) || 0;
      byCh[ch].clicks += Number(r.clicks) || 0;
      byCh[ch].conv += Number(r.conversions) || 0;
      byCh[ch].value += Number(r.conv_value) || 0;
    });
    var chNames = Object.keys(byCh).sort(function(a, b) { return byCh[b].cost - byCh[a].cost; });
    var totalChCost = chNames.reduce(function(s, c) { return s + byCh[c].cost; }, 0);
    
    html += '<div class="charts-row equal">';
    html += '<div class="chart-card"><div class="chart-title">' + t('cpChannels') + '</div><div class="chart-container"><canvas id="ch-cp-channels"></canvas></div></div>';
    html += '<div class="chart-card"><div class="chart-title">' + t('cpChannels') + ' — Detail</div>';
    html += '<table class="data-table"><thead><tr><th>' + t('cpChannel') + '</th><th class="num">' + t('thSpend') + '</th><th class="num">' + t('cpPctBudget') + '</th><th class="num">' + t('thClicks') + '</th><th class="num">' + t('thConv') + '</th><th class="num">' + t('thROAS') + '</th></tr></thead><tbody>';
    chNames.forEach(function(ch) {
      var c = byCh[ch];
      var pct = totalChCost > 0 ? c.cost / totalChCost * 100 : 0;
      var roas = c.cost > 0 ? c.value / c.cost : 0;
      html += '<tr><td style="font-weight:600">' + ch + '</td>';
      html += '<td class="num">' + fmtCur(c.cost) + '</td>';
      html += '<td class="num">' + fmt(pct, 1) + '%</td>';
      html += '<td class="num">' + fmt(c.clicks) + '</td>';
      html += '<td class="num">' + fmt(c.conv, 1) + '</td>';
      html += '<td class="num">' + fmt(roas, 2) + 'x</td></tr>';
    });
    html += '</tbody></table></div></div>';
  }
  
  // ═══ TOP PRODUCTS (from PMax_Products) — e-commerce only ═══
  if (products.length > 0) {
    var topByRev = products.slice().sort(function(a, b) { return (Number(b.conv_value) || 0) - (Number(a.conv_value) || 0); });
    var topSellers = topByRev.filter(function(r) { return Number(r.conversions) > 0; }).slice(0, 15);
    
    if (topSellers.length > 0) {
      html += '<div class="chart-card"><div class="chart-title">' + t('cpTopProducts') + '</div>';
      html += '<table class="data-table"><thead><tr><th>#</th><th>' + t('thProduct') + '</th>';
      if (!currentFilter) html += '<th>' + t('thAccount') + '</th>';
      html += '<th class="num">' + t('thSpend') + '</th><th class="num">' + t('thConv') + '</th><th class="num">' + t('revenue') + '</th><th class="num">' + t('thROAS') + '</th></tr></thead><tbody>';
      topSellers.forEach(function(r, i) {
        var sp = Number(r.cost) || 0, cv = Number(r.conversions) || 0, vl = Number(r.conv_value) || 0;
        var roas = sp > 0 ? vl / sp : 0;
        var badge = roas >= 5 ? 'green' : roas >= 2 ? 'yellow' : 'red';
        var title = (r.product_title || '').length > 45 ? (r.product_title || '').substring(0, 45) + '…' : (r.product_title || '(no title)');
        html += '<tr><td><strong>' + (i + 1) + '</strong></td><td title="' + (r.product_title || '') + '">' + title + '</td>';
        if (!currentFilter) html += '<td>' + r.client_name + '</td>';
        html += '<td class="num">' + fmtCurRow(sp, r) + '</td><td class="num">' + fmt(cv, 1) + '</td>';
        html += '<td class="num"><strong>' + fmtCurRow(vl, r) + '</strong></td>';
        html += '<td class="num"><span class="badge ' + badge + '">' + fmt(roas, 2) + 'x</span></td></tr>';
      });
      html += '</tbody></table></div>';
    }
    
    // ═══ CATEGORY PERFORMANCE ═══
    var catKey = products[0].category_l1 !== undefined ? 'category_l1' : 'product_type_l1';
    var byCat = groupBy(products, catKey);
    var catNames = Object.keys(byCat).sort(function(a, b) { return sum(byCat[b], 'cost') - sum(byCat[a], 'cost'); });
    var catTotal = sum(products, 'cost');
    
    if (catNames.length > 0) {
      html += '<div class="charts-row equal">';
      html += '<div class="chart-card"><div class="chart-title">' + t('cpCategories') + '</div><div class="chart-container"><canvas id="ch-cp-cats"></canvas></div></div>';
      html += '<div class="chart-card"><div class="chart-title">' + t('cpCategories') + ' — Detail</div>';
      html += '<table class="data-table"><thead><tr><th>' + t('thCategory') + '</th><th class="num">' + t('thProducts') + '</th><th class="num">' + t('thSpend') + '</th><th class="num">' + t('thConv') + '</th><th class="num">' + t('revenue') + '</th><th class="num">' + t('thROAS') + '</th><th class="num">' + t('thPctSpend') + '</th></tr></thead><tbody>';
      catNames.forEach(function(cat) {
        var items = byCat[cat], sp = sum(items, 'cost'), cv = sum(items, 'conversions'), vl = sum(items, 'conv_value');
        var roas = sp > 0 ? vl / sp : 0;
        var badge = roas >= 3 ? 'green' : roas >= 1 ? 'yellow' : 'red';
        var pct = catTotal > 0 ? sp / catTotal * 100 : 0;
        html += '<tr><td><strong>' + (cat || '(not set)') + '</strong></td>';
        html += '<td class="num">' + items.length + '</td>';
        html += '<td class="num">' + fmtCur(sp) + '</td>';
        html += '<td class="num">' + fmt(cv, 1) + '</td>';
        html += '<td class="num">' + fmtCur(vl) + '</td>';
        html += '<td class="num"><span class="badge ' + badge + '">' + fmt(roas, 2) + 'x</span></td>';
        html += '<td class="num">' + fmt(pct, 1) + '%</td></tr>';
      });
      html += '</tbody></table></div></div>';
    }
  }
  
  document.getElementById('content').innerHTML = html;
  
  // ═══ DRAW CHARTS ═══
  // Channel donut
  if (hasRealChannels && channels.length > 0) {
    var byCh2 = {};
    channels.forEach(function(r) { var ch = r.channel || 'Other'; byCh2[ch] = (byCh2[ch] || 0) + (Number(r.cost) || 0); });
    var ch2Names = Object.keys(byCh2).sort(function(a, b) { return byCh2[b] - byCh2[a]; });
    createChart('ch-cp-channels', { type: 'doughnut', data: { labels: ch2Names, datasets: [{ data: ch2Names.map(function(c) { return Math.round(byCh2[c] * 100) / 100; }), backgroundColor: [C.blue, C.accent, C.green, C.orange, C.purple, C.teal], borderWidth: 2 }] }, options: doughnutOpts('right', 11) });
  }
  // Category donut (products)
  if (products.length > 0 && document.getElementById('ch-cp-cats')) {
    var catKey2 = products[0].category_l1 !== undefined ? 'category_l1' : 'product_type_l1';
    var byCat2 = {};
    products.forEach(function(r) { var c = r[catKey2] || '(not set)'; byCat2[c] = (byCat2[c] || 0) + (Number(r.cost) || 0); });
    var cat2Names = Object.keys(byCat2).sort(function(a, b) { return byCat2[b] - byCat2[a]; }).slice(0, 8);
    createChart('ch-cp-cats', { type: 'doughnut', data: { labels: cat2Names, datasets: [{ data: cat2Names.map(function(c) { return Math.round(byCat2[c] * 100) / 100; }), backgroundColor: [C.blue, C.accent, C.green, C.orange, C.purple, C.teal, C.pink, '#64748b'], borderWidth: 2 }] }, options: doughnutOpts('right', 11) });
  }
}

    html += '<th class="num">' + (L ? 'Coût' : 'Cost') + '</th>';

    dsaData.sort(function(a,b) { return (Number(b.cost)||0) - (Number(a.cost)||0); });

    html += '<th>' + (L ? 'Campagne' : 'Campaign') + '</th>';
    html += '<th>Target</th>';
    html += '<th class="num">' + (L ? 'Clics' : 'Clicks') + '</th>';
    html += '<th class="num">Impr</th>';
    html += '<th class="num">CTR</th>';
    html += '<th class="num">' + (L ? 'Coût' : 'Cost') + '</th>';

  }

  document.getElementById('content').innerHTML = html;
}

function saveClientAccess() {
  var email = document.getElementById('ac-email').value.trim();
  if (!email) { alert('Email is required'); return; }
  
  var checkedAccounts = [];
  document.querySelectorAll('.ac-acc-chk:checked').forEach(function(cb) { checkedAccounts.push(cb.value); });
  if (checkedAccounts.length === 0) { alert('Select at least one account'); return; }
  
  var data = {
    email: email,
    name: document.getElementById('ac-name').value.trim(),
    role: document.getElementById('ac-role').value,
    accounts: checkedAccounts.join(', '),
    pages: document.getElementById('ac-pages').value,
    status: 'active',
    expires: document.getElementById('ac-expires').value || '',
    notes: document.getElementById('ac-notes').value.trim()
  };
  
  google.script.run.withFailureHandler(function(err) {
    alert('❌ Save failed: ' + err.message);
  }).withSuccessHandler(function(result) {
    if (result.error) { alert('Error: ' + result.error); return; }
    alert('✅ Client ' + result.action + ' successfully!\n\nDashboard link for this client:\n' + window.location.href.split('?')[0] + '?t=' + result.token);
    clearAccessForm();
    renderAccess(); // Refresh
  }).saveClient(SESSION_TOKEN, data);
}

function saveAndInvite() {
  var email = document.getElementById('ac-email').value.trim();
  var name = document.getElementById('ac-name').value.trim();
  if (!email) { alert('Email is required'); return; }
  
  var checkedAccounts = [];
  document.querySelectorAll('.ac-acc-chk:checked').forEach(function(cb) { checkedAccounts.push(cb.value); });
  if (checkedAccounts.length === 0) { alert('Select at least one account'); return; }
  
  var data = {
    email: email,
    name: name,
    role: document.getElementById('ac-role').value,
    accounts: checkedAccounts.join(', '),
    pages: document.getElementById('ac-pages').value,
    status: 'active',
    expires: document.getElementById('ac-expires').value || '',
    notes: document.getElementById('ac-notes').value.trim()
  };
  
  google.script.run.withFailureHandler(function(err) {
    alert('❌ Save failed: ' + err.message);
  }).withSuccessHandler(function(result) {
    if (result.error) { alert('Error: ' + result.error); return; }
    // Now send invite
    google.script.run.withFailureHandler(function(err) {
      alert('Client saved but email failed: ' + err.message);
    }).withSuccessHandler(function(r) {
      if (r.error) { alert('Client saved but email failed: ' + r.error); return; }
      alert('✅ Client added & invitation sent to ' + email + '!\n\nDashboard link:\n' + window.location.href.split('?')[0] + '?t=' + result.token);
      clearAccessForm();
      renderAccess();
    }).sendInviteEmail(SESSION_TOKEN, email, name);
  }).saveClient(SESSION_TOKEN, data);
}

function editClient(email) {
  // Load client data into form
  google.script.run.withSuccessHandler(function(clients) {
    var c = (clients || []).find(function(r) { return String(r.email).toLowerCase() === email.toLowerCase(); });
    if (!c) return;
    document.getElementById('ac-email').value = c.email;
    document.getElementById('ac-name').value = c.name || '';
    // Set role dropdown
    var roleSelect = document.getElementById('ac-role');
    if (roleSelect) roleSelect.value = (c.role === 'manager') ? 'manager' : 'viewer';
    onRoleChange();
    document.getElementById('ac-notes').value = c.notes || '';
    document.getElementById('ac-expires').value = c.expires ? String(c.expires).substring(0,10) : '';
    // Check accounts
    var accs = String(c.accounts || '').split(',').map(function(a) { return a.trim(); });
    document.querySelectorAll('.ac-acc-chk').forEach(function(cb) {
      cb.checked = accs.indexOf(cb.value) >= 0;
      cb.parentElement.style.background = cb.checked ? '#eff6ff' : '#fff';
      cb.parentElement.style.borderColor = cb.checked ? '#3b82f6' : '#d1d5db';
    });
    // Scroll to form
    document.getElementById('ac-email').scrollIntoView({ behavior: 'smooth' });
    document.getElementById('ac-email').focus();
  }).getClientList(SESSION_TOKEN);
}

function revokeClientAccess(email) {
  if (!confirm('Revoke access for ' + email + '? They will see "Access Denied" next time.')) return;
  google.script.run.withSuccessHandler(function(r) {
    if (r.error) { alert('Error: ' + r.error); return; }
    alert('🚫 Access revoked for ' + email);
    renderAccess();
  }).revokeClient(SESSION_TOKEN, email);
}

function reactivateClientAccess(email) {
  google.script.run.withSuccessHandler(function(r) {
    if (r.error) { alert('Error: ' + r.error); return; }
    alert('✅ Access reactivated for ' + email);
    renderAccess();
  }).reactivateClient(SESSION_TOKEN, email);
}

function copyClientLink(clientToken) {
  var baseUrl = window.location.href.split('?')[0];
  var link = baseUrl + '?t=' + clientToken;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(link).then(function() { alert('📋 Link copied!'); });
  } else {
    prompt('Copy this link:', link);
  }
}

function resendInvite(email, name) {
  google.script.run.withSuccessHandler(function(r) {
    if (r.error) { alert('Error: ' + r.error); return; }
    alert('📧 Invitation re-sent to ' + email);
  }).sendInviteEmail(SESSION_TOKEN, email, name);
}

function clearAccessForm() {
  document.getElementById('ac-email').value = '';
  document.getElementById('ac-name').value = '';
  // Role and pages are now fixed hidden inputs, no need to reset
  document.getElementById('ac-notes').value = '';
  document.getElementById('ac-expires').value = '';
  document.querySelectorAll('.ac-acc-chk').forEach(function(cb) {
    cb.checked = false;
    cb.parentElement.style.background = '#fff';
    cb.parentElement.style.borderColor = '#d1d5db';
  });
}

// Load recipients from Access_Control for selected client → populate dropdown
function rptLoadRecipients() {
  var client = document.getElementById('rpt-client').value;
  if (!client) return;
  
  // Update subject with client name
  var subj = document.getElementById('rpt-subject');
  var rptLang = document.querySelector('input[name="rpt-lang"]:checked');
  var lang = rptLang ? rptLang.value : 'en';
  if (subj && !subj.value) {
    subj.value = (lang === 'fr' ? 'Rapport Performance — ' : 'Performance Report — ') + client;
  }
  
  var sel = document.getElementById('rpt-recipient');
  if (!sel) return;
  sel.innerHTML = '<option value="">⏳ Loading...</option>';
  
  google.script.run.withSuccessHandler(function(recipients) {
    sel.innerHTML = '';
    var placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '— ' + t('rptSelectRecipient') + ' —';
    sel.appendChild(placeholder);
    
    if (!recipients || recipients.length === 0) {
      var noOpt = document.createElement('option');
      noOpt.value = '';
      noOpt.textContent = '⚠️ ' + t('rptNoContacts');
      noOpt.disabled = true;
      sel.appendChild(noOpt);
      return;
    }
    
    // Store recipients data for later use
    window._rptRecipients = recipients;
    
    recipients.forEach(function(r, i) {
      var opt = document.createElement('option');
      opt.value = i; // index reference
      opt.textContent = (r.name || 'No name') + ' — ' + r.email + ' (' + (r.role || 'viewer') + ')';
      sel.appendChild(opt);
    });
    
    // Auto-select first if only one
    if (recipients.length === 1) {
      sel.value = '0';
      rptOnRecipientChange();
    }
  }).getReportRecipients(SESSION_TOKEN, client);
}

// When recipient is selected in dropdown
function rptOnRecipientChange() {
  var sel = document.getElementById('rpt-recipient');
  var info = document.getElementById('rpt-recipient-info');
  var detail = document.getElementById('rpt-recipient-detail');
  if (!sel || !info || !detail) return;
  
  var idx = sel.value;
  if (idx === '' || !window._rptRecipients) {
    info.style.display = 'none';
    return;
  }
  
  var r = window._rptRecipients[Number(idx)];
  if (!r) { info.style.display = 'none'; return; }
  
  detail.innerHTML = '<strong>' + (r.name || r.email) + '</strong><br>' +
    '📧 ' + r.email + '<br>' +
    '🔑 ' + (r.role || 'viewer');
  info.style.display = 'block';
}

// Set report language and update subject
function rptSetLang(lang) {
  var enLabel = document.getElementById('rpt-lang-en-label');
  var frLabel = document.getElementById('rpt-lang-fr-label');
  if (enLabel) enLabel.style.borderColor = lang === 'en' ? '#16213E' : '#e2e8f0';
  if (frLabel) frLabel.style.borderColor = lang === 'fr' ? '#16213E' : '#e2e8f0';
  if (enLabel) enLabel.style.background = lang === 'en' ? '#f0f4ff' : '#fff';
  if (frLabel) frLabel.style.background = lang === 'fr' ? '#f0f4ff' : '#fff';
  
  // Update subject placeholder
  var client = document.getElementById('rpt-client').value || '{client}';
  var subj = document.getElementById('rpt-subject');
  if (subj) subj.placeholder = lang === 'fr' ? 'Rapport Performance — ' + client : 'Performance Report — ' + client;
}

// Confirmation step before sending
function rptConfirmSend() {
  var client = document.getElementById('rpt-client').value;
  var sel = document.getElementById('rpt-recipient');
  var idx = sel ? sel.value : '';
  var sections = rptGetSections();
  var rptLang = document.querySelector('input[name="rpt-lang"]:checked');
  var lang = rptLang ? rptLang.value : 'en';
  
  if (!client) { rptStatus(t('rptNoClient'), '#f59e0b'); return; }
  if (idx === '' || !window._rptRecipients) { rptStatus(t('rptNoRecipient'), '#f59e0b'); return; }
  if (!sections._any) { rptStatus(t('rptNoSections'), '#f59e0b'); return; }
  
  var r = window._rptRecipients[Number(idx)];
  var sectionNames = [];
  if (sections.kpis) sectionNames.push('📊 KPIs');
  if (sections.budget) sectionNames.push('💰 Budget');
  if (sections.decisions) sectionNames.push('🔍 Indices Stratégiques');
  if (sections.signals) sectionNames.push('🔔 Signal Quality');
  if (sections.learning) sectionNames.push('🎓 Learning Tracker');
  if (sections.anomalies) sectionNames.push('🚨 Anomalies');
  if (sections.quality) sectionNames.push('⭐ Quality Scores');
  if (sections.health) sectionNames.push('🏥 Account Health');
  if (sections.performance) sectionNames.push('📈 Performance');
  if (sections.search) sectionNames.push('🔍 Search Terms');
  if (sections.pmax) sectionNames.push('🚀 PMax');
  if (sections.tracking) sectionNames.push('🔗 Tracking');
  
  var confirmDiv = document.getElementById('rpt-confirm');
  var confirmDetail = document.getElementById('rpt-confirm-detail');
  if (!confirmDiv || !confirmDetail) return;
  
  var attachCount = (window._rptAttachments || []).length;
  var attachLine = attachCount > 0 ? '<br><strong>📎 ' + (lang === 'fr' ? 'Pièces jointes' : 'Attachments') + ':</strong> ' + attachCount + ' ' + (lang === 'fr' ? 'fichier(s)' : 'file(s)') + ' — ' + window._rptAttachments.map(function(a) { return a.name; }).join(', ') : '';
  
  confirmDetail.innerHTML = 
    '<strong>' + t('rptRecipient') + ':</strong> ' + (r.name || '') + ' &lt;' + r.email + '&gt;<br>' +
    '<strong>' + t('rptSelectClient') + ':</strong> ' + client + '<br>' +
    '<strong>' + t('rptLang') + ':</strong> ' + (lang === 'fr' ? '🇫🇷 Français' : '🇬🇧 English') + '<br>' +
    '<strong>Sections:</strong> ' + sectionNames.join(', ') + attachLine;
  
  confirmDiv.style.display = 'block';
  confirmDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function rptGetTemplateCategories() {
  var rptLang = document.querySelector('input[name="rpt-lang"]:checked');
  var L = rptLang ? rptLang.value : LANG;
  var cats = {
    general:     { label: L==='fr' ? '📬 Général / Intro'        : '📬 General / Intro',        items: [] },
    tracking:    { label: L==='fr' ? '🔗 Tracking'               : '🔗 Tracking',               items: [] },
    quality:     { label: L==='fr' ? '⭐ Quality Scores'         : '⭐ Quality Scores',         items: [] },
    search:      { label: L==='fr' ? '🔍 Termes de Recherche'    : '🔍 Search Terms',           items: [] },
    keywords:    { label: L==='fr' ? '🔑 Mots-clés'              : '🔑 Keywords',               items: [] },
    budget:      { label: L==='fr' ? '💰 Budget'                 : '💰 Budget',                 items: [] },
    performance: { label: L==='fr' ? '📈 Performance'            : '📈 Performance',            items: [] },
    pmax:        { label: L==='fr' ? '🚀 PMax'                   : '🚀 PMax',                   items: [] },
    closing:     { label: L==='fr' ? '📋 Clôture / Pièces jointes' : '📋 Closing / Attachments', items: [] }
  };
  Object.keys(RPT_TEMPLATES).forEach(function(id) {
    var tpl = RPT_TEMPLATES[id];
    var displayName = (L === 'fr' && tpl.label_fr) ? tpl.label_fr : tpl.label;
    if (cats[tpl.cat]) cats[tpl.cat].items.push({ id: id, icon: tpl.icon, name: displayName });
  });
  return Object.keys(cats).map(function(k) { return cats[k]; }).filter(function(c) { return c.items.length > 0; });
}

// Add template block to message area
function rptAddTemplate() {
  var sel = document.getElementById('rpt-tpl-select');
  if (!sel || !sel.value) return;
  var tplId = sel.value;
  var tpl = RPT_TEMPLATES[tplId];
  if (!tpl) return;
  
  var rptLang = document.querySelector('input[name="rpt-lang"]:checked');
  var L = rptLang ? rptLang.value : LANG;
  var text = tpl[L] || tpl.en;
  
  // Replace {name} with recipient name
  var recipSel = document.getElementById('rpt-recipient');
  var recipName = '';
  if (recipSel && recipSel.value !== '' && window._rptRecipients) {
    var r = window._rptRecipients[Number(recipSel.value)];
    if (r) recipName = (r.name || '').split(' ')[0]; // First name only
  }
  text = text.replace(/\{name\}/g, recipName || (L==='fr' ? 'Client' : 'there'));
  
  // Add block
  if (!window._rptMsgBlocks) window._rptMsgBlocks = [];
  window._rptMsgBlocks.push({ id: tplId + '_' + Date.now(), tplId: tplId, icon: tpl.icon, text: text });
  
  sel.value = '';
  rptRenderBlocks();
  rptUpdatePreviewSummary();
}

// Render stacked message blocks
function rptRenderBlocks() {
  var container = document.getElementById('rpt-msg-blocks');
  if (!container) return;
  var blocks = window._rptMsgBlocks || [];
  
  if (blocks.length === 0) { container.innerHTML = ''; return; }
  
  var html = '';
  blocks.forEach(function(b, i) {
    var preview = b.text.split('\n').filter(Boolean)[0].substring(0, 50);
    var tpl = RPT_TEMPLATES[b.tplId];
    var isClosing = tpl && tpl.cat === 'closing';
    var posLabel = isClosing ? '⬇ AFTER DATA' : '⬆ BEFORE DATA';
    var posColor = isClosing ? '#16a34a' : '#3b82f6';
    var borderColor = isClosing ? '#bbf7d0' : '#bfdbfe';
    
    html += '<div style="display:flex;align-items:center;gap:6px;background:' + (isClosing ? '#f0fdf4' : '#f8fafc') + ';border:1px solid ' + borderColor + ';border-radius:8px;padding:8px 10px;font-size:12px" id="rpt-block-' + i + '">';
    
    // Move buttons
    html += '<div style="display:flex;flex-direction:column;gap:1px">';
    if (i > 0) html += '<button onclick="rptMoveBlock(' + i + ',-1)" style="background:none;border:none;cursor:pointer;font-size:10px;padding:0;line-height:1" title="Move up">▲</button>';
    else html += '<span style="font-size:10px;color:#e2e8f0;padding:0;line-height:1">▲</span>';
    if (i < blocks.length - 1) html += '<button onclick="rptMoveBlock(' + i + ',1)" style="background:none;border:none;cursor:pointer;font-size:10px;padding:0;line-height:1" title="Move down">▼</button>';
    else html += '<span style="font-size:10px;color:#e2e8f0;padding:0;line-height:1">▼</span>';
    html += '</div>';
    
    // Order number
    html += '<span style="background:#16213E;color:#fff;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">' + (i + 1) + '</span>';
    
    // Icon + preview
    html += '<span style="flex:1;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + b.icon + ' ' + preview + '</span>';
    
    // Position badge (intro vs closing)
    html += '<span style="font-size:8px;padding:1px 5px;border-radius:4px;background:' + posColor + ';color:#fff;font-weight:700;white-space:nowrap">' + posLabel + '</span>';
    
    // Edit + Remove
    html += '<button onclick="rptEditBlock(' + i + ')" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px" title="Edit">✏️</button>';
    html += '<button onclick="rptRemoveBlock(' + i + ')" style="background:none;border:none;cursor:pointer;font-size:13px;padding:2px;color:#dc2626" title="Remove">✕</button>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function rptMoveBlock(index, direction) {
  var blocks = window._rptMsgBlocks || [];
  var newIndex = index + direction;
  if (newIndex < 0 || newIndex >= blocks.length) return;
  var tmp = blocks[index];
  blocks[index] = blocks[newIndex];
  blocks[newIndex] = tmp;
  rptRenderBlocks();
}

function rptRemoveBlock(index) {
  var blocks = window._rptMsgBlocks || [];
  blocks.splice(index, 1);
  rptRenderBlocks();
  rptUpdatePreviewSummary();
}

function rptEditBlock(index) {
  var blocks = window._rptMsgBlocks || [];
  var b = blocks[index];
  if (!b) return;
  var newText = prompt('Edit message block:', b.text);
  if (newText !== null) {
    b.text = newText;
    rptRenderBlocks();
  }
}

// Combine all blocks + free text into final message
// Returns { intro: '...', closing: '...' } if split=true, or string if split=false
function rptGetFullMessage(split) {
  var blocks = window._rptMsgBlocks || [];
  var closingCats = ['closing']; // Templates from 'closing' category go after data
  
  var introBlocks = [];
  var closingBlocks = [];
  
  blocks.forEach(function(b) {
    var tpl = RPT_TEMPLATES[b.tplId];
    if (tpl && closingCats.indexOf(tpl.cat) !== -1) {
      closingBlocks.push(b.text);
    } else {
      introBlocks.push(b.text);
    }
  });
  
  var freeText = (document.getElementById('rpt-message') || {}).value || '';
  if (freeText.trim()) introBlocks.push(freeText.trim());
  
  if (split) {
    return { intro: introBlocks.join('\n\n'), closing: closingBlocks.join('\n\n') };
  }
  return introBlocks.concat(closingBlocks).join('\n\n');
}

// ═══ FILE ATTACHMENTS ═══
window._rptAttachments = [];

function rptOnFileSelect(input) {
  var files = input.files;
  if (!files || files.length === 0) return;
  
  for (var i = 0; i < files.length; i++) {
    var file = files[i];
    if (file.size > 5 * 1024 * 1024) {
      alert(file.name + ' — ' + t('rptFileTooLarge'));
      continue;
    }
    (function(f) {
      var reader = new FileReader();
      reader.onload = function(e) {
        var base64 = e.target.result.split(',')[1]; // Remove data:...;base64, prefix
        window._rptAttachments.push({
          name: f.name,
          mime: f.type || 'application/octet-stream',
          size: f.size,
          data: base64
        });
        rptRenderFileList();
        rptUpdatePreviewSummary();
      };
      reader.readAsDataURL(f);
    })(file);
  }
  input.value = ''; // Reset for re-selection
}

function rptRenderFileList() {
  var container = document.getElementById('rpt-file-list');
  if (!container) return;
  var files = window._rptAttachments || [];
  if (files.length === 0) { container.innerHTML = ''; return; }
  
  var html = '';
  files.forEach(function(f, i) {
    var sizeKB = Math.round(f.size / 1024);
    var icon = f.name.match(/\.pdf$/i) ? '📄' : f.name.match(/\.xls/i) ? '📊' : f.name.match(/\.(png|jpg|jpeg)$/i) ? '🖼️' : '📁';
    html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:6px;font-size:12px">';
    html += '<span>' + icon + '</span>';
    html += '<span style="flex:1;font-weight:500;color:#0c4a6e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + f.name + '</span>';
    html += '<span style="color:#64748b;font-size:10px">' + sizeKB + 'KB</span>';
    html += '<button onclick="rptRemoveFile(' + i + ')" style="background:none;border:none;cursor:pointer;color:#dc2626;font-size:13px;padding:2px" title="Remove">✕</button>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function rptRemoveFile(index) {
  window._rptAttachments.splice(index, 1);
  rptRenderFileList();
  rptUpdatePreviewSummary();
}

function rptBuildHTML(client, sections, emailLang) {
  var kpis = (DATA.dailyKpis || []).filter(function(r) { return r.client_name === client; });

  var h = '';
  
  // Translation helper for email (uses emailLang, not dashboard LANG)
  var L = emailLang || 'en';
  function rt(key) { return (T[L] && T[L][key]) || T.en[key] || key; }
  
  // Inline style helpers for email compatibility
  var sCard = 'display:inline-block;width:30%;min-width:120px;background:#f8fafc;border-radius:8px;padding:14px 16px;margin:4px;text-align:center;border:1px solid #e2e8f0;';
  var sLabel = 'font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.5px;';
  var sValue = 'font-size:22px;font-weight:700;color:#16213E;margin-top:4px;';
  var sTable = 'width:100%;border-collapse:collapse;font-size:12px;';
  var sTh = 'background:#16213E;color:#fff;padding:8px 12px;text-align:left;font-size:11px;text-transform:uppercase;';
  var sTd = 'padding:8px 12px;border-bottom:1px solid #f1f5f9;';
  var sSection = 'margin:24px 0 12px;font-size:16px;font-weight:700;color:#16213E;border-bottom:2px solid #e2e8f0;padding-bottom:8px;';
  
  // Period info
  var periodLabel = L === 'fr' ? 'Période' : 'Period';
  var generatedLabel = L === 'fr' ? 'Généré le' : 'Generated';
  // Use filtered data for period (respects date picker)
  var rpEmailDates = filtered.map(function(r) { return String(r.date || '').substring(0, 10); }).filter(function(d) { return d.length === 10 && /^\d{4}-\d{2}-\d{2}$/.test(d); });
  rpEmailDates = rpEmailDates.filter(function(v, i, a) { return a.indexOf(v) === i; }).sort(); // unique + sorted
  var periodStr = rpEmailDates.length > 0 ? rpEmailDates[0] + ' → ' + rpEmailDates[rpEmailDates.length - 1] + ' (' + rpEmailDates.length + ' ' + (L==='fr' ? 'jours' : 'days') + ')' : (L==='fr' ? 'Toutes les données' : 'All data');
  h += '<div style="font-size:12px;color:#94a3b8;margin-bottom:16px">' + periodLabel + ': ' + periodStr + ' | ' + generatedLabel + ': ' + new Date().toLocaleDateString(L === 'fr' ? 'fr-FR' : 'en-AU') + '</div>';
  
  // ═══ KPIs SECTION ═══
  if (sections.kpis) {
    var totalSpend = sum(filtered, 'cost');
    var totalConv = sum(filtered, 'conversions');

        var roas2 = Number(p.cost) > 0 ? Number(p.conv_value) / Number(p.cost) : 0;
        h += '<tr><td style="' + sTd + 'font-weight:600">' + (p.campaign_name || '—') + '</td>';
        h += '<td style="' + sTd + '">' + fmtCur(Number(p.cost) || 0) + '</td>';
        h += '<td style="' + sTd + '">' + fmt(Number(p.conversions) || 0) + '</td>';
        h += '<td style="' + sTd + 'color:' + (roas2 < 1 ? '#dc2626' : '#16a34a') + ';font-weight:600">' + fmt(roas2, 2) + 'x</td></tr>';
      });
      h += '</tbody></table>';
    }
  }
  
  // ═══ GA4 SECTION ═══
  if (sections.ga4) {
    var ga4 = filterData((DATA.ga4Daily || []).filter(function(r) { return r.client_name === client; }));
    if (ga4.length > 0) {
      h += '<div style="' + sSection + '">📈 ' + (L==='fr' ? 'Trafic GA4' : 'GA4 Website Traffic') + '</div>';
      var ga4Sessions = sum(ga4, 'sessions'), ga4Users = sum(ga4, 'users'), ga4Bounce = avg(ga4, 'bounce_rate');
      h += '<div style="text-align:center">';
      h += '<div style="' + sCard + '"><div style="' + sLabel + '">Sessions</div><div style="' + sValue + '">' + fmt(ga4Sessions) + '</div></div>';
      h += '<div style="' + sCard + '"><div style="' + sLabel + '">' + (L==='fr' ? 'Utilisateurs' : 'Users') + '</div><div style="' + sValue + '">' + fmt(ga4Users) + '</div></div>';
      h += '<div style="' + sCard + '"><div style="' + sLabel + '">' + (L==='fr' ? 'Taux de Rebond' : 'Bounce Rate') + '</div><div style="' + sValue + 'color:' + (ga4Bounce > 0.6 ? '#dc2626' : '#16a34a') + '">' + fmt(ga4Bounce * 100, 1) + '%</div></div>';
      h += '</div>';
    }
  }
  
  // ═══ ACTION HISTORY SECTION ═══
  if (sections.actionhistory) {
    var historyData = window._actionHistoryData || [];
    var clientHistory = historyData
      .filter(function(h) { return h.status === 'archived' && h.client_name === client; })
      .sort(function(a, b) { return (b.timestamp || '').localeCompare(a.timestamp || ''); });
    
    // Deduplicate
    var seenH = {};
    var uniqueH = [];
    clientHistory.forEach(function(h) {
      if (!seenH[h.action_id]) { seenH[h.action_id] = true; uniqueH.push(h); }
    });
    
    h += '<div style="' + sSection + '">📜 ' + (L==='fr' ? 'Historique des Actions' : 'Action History') + '</div>';
    
    if (uniqueH.length === 0) {
      h += '<div style="background:#f0fdf4;border-radius:8px;padding:12px 16px;font-size:13px;color:#16a34a">✅ ' + (L==='fr' ? 'Aucune action archivée pour ce compte.' : 'No archived actions for this account.') + '</div>';
    } else {
      // Summary scorecards
      h += '<div style="text-align:center;margin-bottom:12px">';
      h += '<div style="' + sCard + '"><div style="' + sLabel + '">' + (L==='fr' ? 'Actions Résolues' : 'Resolved') + '</div><div style="' + sValue + 'color:#16a34a">' + uniqueH.length + '</div></div>';
      var critH = uniqueH.filter(function(h) { return h.priority === 'critical'; }).length;
      var highH = uniqueH.filter(function(h) { return h.priority === 'high'; }).length;
      h += '<div style="' + sCard + '"><div style="' + sLabel + '">Critical</div><div style="' + sValue + 'color:#dc2626">' + critH + '</div></div>';
      h += '<div style="' + sCard + '"><div style="' + sLabel + '">' + (L==='fr' ? 'Important' : 'High') + '</div><div style="' + sValue + 'color:#ea580c">' + highH + '</div></div>';
      h += '</div>';
      
      // Table
      h += '<table style="' + sTable + '"><thead><tr>';
      h += '<th style="' + sTh + '">Date</th>';
      h += '<th style="' + sTh + '">Action</th>';
      h += '<th style="' + sTh + '">' + (L==='fr' ? 'Priorité' : 'Priority') + '</th>';
      h += '</tr></thead><tbody>';
      
      uniqueH.forEach(function(a) {
        var priColor = a.priority === 'critical' ? '#dc2626' : a.priority === 'high' ? '#ea580c' : a.priority === 'medium' ? '#ca8a04' : '#16a34a';
        var priIcon = a.priority === 'critical' ? '🔴' : a.priority === 'high' ? '🟠' : a.priority === 'medium' ? '🟡' : '🟢';
        h += '<tr>';
        h += '<td style="' + sTd + 'font-size:11px;color:#64748b;white-space:nowrap">' + (a.timestamp || '—').substring(0, 10) + '</td>';
        h += '<td style="' + sTd + 'font-size:12px">' + priIcon + ' ' + (a.title || '—') + '</td>';
        h += '<td style="' + sTd + '"><span style="background:' + priColor + '15;color:' + priColor + ';padding:2px 6px;border-radius:4px;font-size:10px;font-weight:600">' + (a.priority || '').toUpperCase() + '</span></td>';
        h += '</tr>';
      });
      h += '</tbody></table>';
    }
  }
  
  return h;
}

function rptGetSections() {
  var s = {};
  ['kpis', 'budget', 'decisions', 'signals', 'learning', 'anomalies', 'quality', 'health', 'performance', 'search', 'pmax', 'tracking', 'ga4'].forEach(function(id) {
    var cb = document.getElementById('rpt-sec-' + id);
    s[id] = cb ? cb.checked : false;
  });
  s._any = Object.keys(s).some(function(k) { return k !== '_any' && s[k]; });
  return s;
}

// Send report email (called from confirm dialog)
function rptSendEmail() {
  var client = document.getElementById('rpt-client').value;
  var sel = document.getElementById('rpt-recipient');
  var idx = sel ? sel.value : '';
  
  if (!client || idx === '' || !window._rptRecipients) {
    rptStatus(t('rptNoRecipient'), '#f59e0b'); return;
  }
  
  var r = window._rptRecipients[Number(idx)];
  var email = r.email;
  var name = r.name || '';
  
  var rptLang = document.querySelector('input[name="rpt-lang"]:checked');
  var lang = rptLang ? rptLang.value : 'en';
  
  var subject = document.getElementById('rpt-subject').value || 
    (lang === 'fr' ? 'Rapport Performance — ' + client : 'Performance Report — ' + client);
  var msgParts = rptGetFullMessage(true); // { intro: '...', closing: '...' }
  
  var sections = rptGetSections();
  if (!sections._any) { rptStatus(t('rptNoSections'), '#f59e0b'); return; }
  
  var htmlBody = rptBuildHTML(client, sections, lang);
  
  // Prepare attachments (without base64 data in preview, send full data to backend)
  var attachments = (window._rptAttachments || []).map(function(a) {
    return { name: a.name, mime: a.mime, data: a.data };
  });
  
  // Hide confirm dialog
  var confirmDiv = document.getElementById('rpt-confirm');
  if (confirmDiv) confirmDiv.style.display = 'none';
  
  var attachLabel = attachments.length > 0 ? ' + ' + attachments.length + ' 📎' : '';
  rptStatus(t('rptSending') + attachLabel, '#3b82f6');
  
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.error) {
        rptStatus(t('rptError') + ': ' + result.error, '#dc2626');
      } else {
        rptStatus(t('rptSent') + ' → ' + name + ' (' + email + ')' + attachLabel, '#16a34a');
        window._rptAttachments = []; // Clear after send
        rptRenderFileList();
        var modal = document.getElementById('rpt-modal');
        if (modal) modal.classList.remove('show');
      }
    })
    .withFailureHandler(function(err) {
      rptStatus(t('rptError') + ': ' + err.message, '#dc2626');
    })
    .sendClientReport(SESSION_TOKEN, email, name, client, subject, htmlBody, msgParts.intro, lang, attachments, msgParts.closing);
}

}

/** Build warning banner HTML if any GA4 clients have stale/failed data */
function ga4StatusBanner() {
  var status = DATA.ga4FetchStatus;
  if (!status || status.length === 0) return '';
  
  var failed = status.filter(function(s) {
    // If filtering by client, only show warning for that client
    if (currentFilter && s.client_name !== currentFilter) return false;
    return s.status === 'partial';
  });
  if (failed.length === 0) return '';
  
  var clientNames = failed.map(function(s) {
    var parts = [];
    if (s.daily === 'fail') parts.push('Daily');
    if (s.channels === 'fail') parts.push('Channels');
    if (s.pages === 'fail') parts.push('LPs');
    return s.client_name + ' (' + parts.join(', ') + ')';
  });
  
  var lastTs = failed[0].timestamp || '';
  
  return '<div style="background:#fef3c7;border:1px solid #f59e0b;border-left:4px solid #f59e0b;border-radius:0 8px 8px 0;padding:12px 16px;margin-bottom:16px">'
    + '<div style="font-weight:700;font-size:13px;color:#92400e">' + t('ga4StaleData') + '</div>'
    + '<div style="font-size:12px;color:#78350f;margin-top:4px;line-height:1.5">'
    + tt('ga4StaleDesc', { clients: clientNames.join(', ') })
    + (lastTs ? '<br><span style="color:#a16207;font-size:11px">Last fetch: ' + lastTs + '</span>' : '')
    + '</div></div>';
}

// ─── PAGE 1: Analytics Overview ───────────────────────────────

function renderAnalyticsOverview() {
  var daily = ga4FilterData(DATA.ga4Daily);
  var channels = ga4FilterData(DATA.ga4Channels);
  var keyEvents = ga4FilterData(DATA.ga4KeyEvents);
  var L = LANG === 'fr';

  if (daily.length === 0 && channels.length === 0) {
    document.getElementById('content').innerHTML = '<div class="chart-card"><div class="chart-title">' + t('ga4NoData') + '</div>'
      + '<div style="padding:20px;font-size:13px;color:#64748b;line-height:1.8">'
      + '<p>' + t('ga4NoDataDesc') + '</p>'
      + '<ol style="margin:12px 0 0 20px"><li>' + (L ? 'Active l\'API Google Analytics Data dans GCP' : 'Enable Google Analytics Data API in GCP') + '</li>'
      + '<li>' + (L ? 'Ajoute le service AnalyticsData dans Apps Script' : 'Add AnalyticsData advanced service in Apps Script') + '</li>'
      + '<li>' + (L ? 'Configure les Property IDs dans le script' : 'Configure Property IDs in the script') + '</li>'
      + '<li>' + (L ? 'Lance fetchAllGA4Data() manuellement' : 'Run fetchAllGA4Data() manually') + '</li></ol></div></div>';
    return;
  }

  var h = '';
  h += ga4StatusBanner();

  // ═══ KEY EVENTS BREAKDOWN (from GA4_KeyEvents) ═══
  var keByEvent = {};
  var keByChannel = {};
  var keBySrcMed = {};
  var totRevKE = 0;
  keyEvents.forEach(function(r) {
    var ev = r.event_name || '(unknown)';
    var ch = r.channel_group || '(not set)';
    var src = r.source || '(not set)';
    var med = r.medium || '(not set)';
    var srcMed = src + ' / ' + med;
    var cnt = Number(r.key_events) || 0;
    var rev = Number(r.event_revenue) || 0;

    if (!keByEvent[ev]) keByEvent[ev] = { count: 0, revenue: 0 };
    keByEvent[ev].count += cnt;
    keByEvent[ev].revenue += rev;

    if (!keByChannel[ch]) keByChannel[ch] = { count: 0, revenue: 0 };
    keByChannel[ch].count += cnt;
    keByChannel[ch].revenue += rev;

    if (!keBySrcMed[srcMed]) keBySrcMed[srcMed] = { count: 0, revenue: 0, channel: ch };
    keBySrcMed[srcMed].count += cnt;
    keBySrcMed[srcMed].revenue += rev;

    totRevKE += rev;
  });
  var keNames = Object.keys(keByEvent).sort(function(a,b) { return keByEvent[b].count - keByEvent[a].count; });
  var totKE = keNames.reduce(function(s,n) { return s + keByEvent[n].count; }, 0);
  var keChNames = Object.keys(keByChannel).sort(function(a,b) { return keByChannel[b].count - keByChannel[a].count; });
  var keSrcMedNames = Object.keys(keBySrcMed).sort(function(a,b) { return keBySrcMed[b].count - keBySrcMed[a].count; });

  // ═══ KPI SUMMARY CARDS ═══
  var totSess = 0, totUsers = 0, totNew = 0, totRet = 0, totConv = 0;
  daily.forEach(function(r) {
    totSess += Number(r.sessions) || 0;
    totUsers += Number(r.users) || 0;
    totNew += Number(r.new_users) || 0;
    totRet += Number(r.returning_users) || 0;
    totConv += Number(r.conversions) || 0;
  });
  var avgEng = 0, engCount = 0;
  daily.forEach(function(r) {
    var e = Number(r.engagement_rate);
    if (e > 0) { avgEng += e * (Number(r.sessions) || 1); engCount += Number(r.sessions) || 1; }
  });
  avgEng = engCount > 0 ? avgEng / engCount : 0;

  h += '<div class="kpi-grid">';
  h += kpi(t('ga4Sessions'), fmt(totSess), '', '📊');
  h += kpi(t('ga4Users'), fmt(totUsers), '', '👥');
  h += kpi(t('ga4NewUsers'), fmt(totNew), totUsers > 0 ? Math.round(totNew / totUsers * 100) + '% ' + (L ? 'du total' : 'of total') : '', '🆕');
  h += kpi(t('ga4Engagement'), (avgEng * 100).toFixed(1) + '%', '', '🎯');
  // Show key events breakdown as sub-text under total
  var convSub = '';
  if (keNames.length > 0) {
    convSub = keNames.slice(0, 3).map(function(n) { return n + ': ' + fmt(keByEvent[n].count); }).join(' · ');
  }
  h += kpi(t('ga4Conv'), fmt(totKE > 0 ? totKE : totConv), convSub, '✅');
  if (totRevKE > 0) h += kpi(L ? 'Revenue' : 'Revenue', fmtCur(totRevKE), '', '💰');
  h += '</div>';

  // ═══ ROW 1: Channel Mix Donut + Key Events Breakdown ═══
  h += '<div class="grid-2">';

  // Channel mix donut
  h += '<div class="chart-card">';
  h += ga4InfoBox('ga4ChannelMix', 'ga4ChannelMixDesc');
  h += '<div class="chart-container tall"><canvas id="ga4-channel-donut"></canvas></div>';
  h += '</div>';

  // Key Events Breakdown donut (replaces New vs Returning — moved to row 2)

      if (totRevKE > 0) h += '<td class="num">' + (k.revenue > 0 ? fmtCur(k.revenue) : '—') + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table>';
    h += '</div>';

    h += '</div>';

    // ═══ ROW 2b: Key Events by Channel Donut + Source/Medium Table ═══
    h += '<div class="grid-2">';

    // Key Events by Channel donut
    h += '<div class="chart-card">';

    h += '</div>';

    h += '<div class="chart-card">';
    h += '<div class="chart-title">🔍 ' + (L ? 'Key Events par Source / Medium' : 'Key Events by Source / Medium') + '</div>';

    h += '<table class="data-table"><thead><tr><th>Source / Medium</th><th>' + (L ? 'Canal' : 'Channel') + '</th><th class="num">' + (L ? 'Compte' : 'Count') + '</th><th class="num">%</th>';

    h += '</tr></thead><tbody>';
    keSrcMedNames.slice(0, 20).forEach(function(sm) {

      h += '<td class="num">' + fmt(pct, 1) + '%</td>';

  h += '</div>';

  document.getElementById('content').innerHTML = h;

  // 1. Channel Mix Donut
  var chMix = {};
  channels.forEach(function(r) {
    var ch = r.channel_group || '(Other)';
    if (!chMix[ch]) chMix[ch] = 0;
    chMix[ch] += Number(r.sessions) || 0;
  });
  var chLabels = Object.keys(chMix).sort(function(a,b) { return chMix[b] - chMix[a]; });
  var chValues = chLabels.map(function(k) { return chMix[k]; });
  var chColors = chLabels.map(ga4Color);
  var totalSess = chValues.reduce(function(a,b){return a+b;}, 0) || 1;

  chartInstances['ga4-channel-donut'] = new Chart(document.getElementById('ga4-channel-donut'), {
    type: 'doughnut',
    data: { labels: chLabels, datasets: [{ data: chValues, backgroundColor: chColors, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      cutout: '60%',
      plugins: {
        legend: { position: 'right', labels: { font: { size: 11 }, padding: 8, generateLabels: function(chart) {
          return chart.data.labels.map(function(label, i) {
            var pct = Math.round(chart.data.datasets[0].data[i] / totalSess * 100);
            return { text: label + ' (' + pct + '%)', fillStyle: chart.data.datasets[0].backgroundColor[i], strokeStyle: '#fff', lineWidth: 1, index: i };
          });
        }}},
        tooltip: { callbacks: { label: function(ctx) { return ctx.label + ': ' + fmt(ctx.raw) + ' sessions (' + Math.round(ctx.raw / totalSess * 100) + '%)'; } } }
      }
    }
  });

  var keDonutEl = document.getElementById('ga4-keyevents-donut');
  if (keDonutEl && keNames.length > 0) {
    var keColors = ['#16a34a','#3b82f6','#f59e0b','#8b5cf6','#ef4444','#06b6d4','#ec4899','#84cc16','#f97316','#6366f1'];
    var keLabels = keNames.slice(0, 10);
    var keValues = keLabels.map(function(n) { return keByEvent[n].count; });
    chartInstances['ga4-keyevents-donut'] = new Chart(keDonutEl, {
      type: 'doughnut',
      data: { labels: keLabels, datasets: [{ data: keValues, backgroundColor: keColors.slice(0, keLabels.length), borderWidth: 2, borderColor: '#fff' }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '60%',
        plugins: {
          legend: { position: 'right', labels: { font: { size: 11 }, padding: 8, generateLabels: function(chart) {
            return chart.data.labels.map(function(label, i) {
              var pct = Math.round(chart.data.datasets[0].data[i] / (totKE || 1) * 100);
              return { text: label + ' (' + pct + '%)', fillStyle: chart.data.datasets[0].backgroundColor[i], strokeStyle: '#fff', lineWidth: 1, index: i };

          tooltip: { callbacks: { label: function(ctx) { return ctx.label + ': ' + fmt(ctx.raw) + ' (' + Math.round(ctx.raw / (totKE || 1) * 100) + '%)'; } } }
        }
      }
    });
  }

  // 2b. Key Events by Channel Donut
  var keChDonutEl = document.getElementById('ga4-ke-channel-donut');
  if (keChDonutEl && keChNames.length > 0) {
    var keChLabels = keChNames.slice(0, 10);
    var keChValues = keChLabels.map(function(n) { return keByChannel[n].count; });
    var keChColors = keChLabels.map(ga4Color);
    chartInstances['ga4-ke-channel-donut'] = new Chart(keChDonutEl, {
      type: 'doughnut',
      data: { labels: keChLabels, datasets: [{ data: keChValues, backgroundColor: keChColors, borderWidth: 2, borderColor: '#fff' }] },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '60%',
        plugins: {
          legend: { position: 'right', labels: { font: { size: 11 }, padding: 8, generateLabels: function(chart) {
            return chart.data.labels.map(function(label, i) {
              var pct = Math.round(chart.data.datasets[0].data[i] / (totKE || 1) * 100);
              return { text: label + ' (' + pct + '%)', fillStyle: chart.data.datasets[0].backgroundColor[i], strokeStyle: '#fff', lineWidth: 1, index: i };
            });
          }}},
          tooltip: { callbacks: { label: function(ctx) { return ctx.label + ': ' + fmt(ctx.raw) + ' (' + Math.round(ctx.raw / (totKE || 1) * 100) + '%)'; } } }
        }
      }
    });
  }

  // 3. New vs Returning
  var nvrEl = document.getElementById('ga4-new-vs-ret');
  if (nvrEl) {
    var dailyByDate = {};
    daily.forEach(function(r) {
      var d = String(r.date || '').substring(0, 10);
      if (!dailyByDate[d]) dailyByDate[d] = { newU: 0, retU: 0 };
      dailyByDate[d].newU += Number(r.new_users) || 0;
      dailyByDate[d].retU += Number(r.returning_users) || 0;
    });
    var nvrDates = Object.keys(dailyByDate).sort();
    var nvrNew = nvrDates.map(function(d) { return dailyByDate[d].newU; });
    var nvrRet = nvrDates.map(function(d) { return dailyByDate[d].retU; });
    var nvrLabels = nvrDates.map(function(d) { return d.substring(5); }); // MM-DD

    chartInstances['ga4-new-vs-ret'] = new Chart(nvrEl, {
      type: 'line',
      data: {
        labels: nvrLabels,
        datasets: [
          { label: t('ga4NewUsers'), data: nvrNew, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.3, pointRadius: 0 },
          { label: t('ga4Returning'), data: nvrRet, borderColor: '#8b5cf6', backgroundColor: 'rgba(139,92,246,0.1)', fill: true, tension: 0.3, pointRadius: 0 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { labels: { font: { size: 11 } } } },
        scales: { x: { ticks: { maxTicksAutoSkip: true, maxRotation: 0, font: { size: 10 } } }, y: { beginAtZero: true } }
      }
    });
  }

  // 3. Sessions Trend (stacked bar by channel)
  var trendDates = {};
  var trendChannels = {};
  channels.forEach(function(r) {
    var d = String(r.date || '').substring(0, 10);
    var ch = r.channel_group || '(Other)';
    trendDates[d] = true;
    trendChannels[ch] = (trendChannels[ch] || 0) + (Number(r.sessions) || 0);
  });
  var tDates = Object.keys(trendDates).sort();
  // Keep top 6 channels, group rest as Other
  var topCh = Object.keys(trendChannels).sort(function(a,b) { return trendChannels[b] - trendChannels[a]; }).slice(0, 6);
  
  var trendByDateCh = {};
  channels.forEach(function(r) {
    var d = String(r.date || '').substring(0, 10);
    var ch = topCh.indexOf(r.channel_group) !== -1 ? r.channel_group : '(Other)';
    var key = d + '||' + ch;
    trendByDateCh[key] = (trendByDateCh[key] || 0) + (Number(r.sessions) || 0);
  });
  var allTrendCh = topCh.slice();
  if (allTrendCh.indexOf('(Other)') === -1) allTrendCh.push('(Other)');

  var trendDatasets = allTrendCh.map(function(ch) {
    return {
      label: ch, backgroundColor: ga4Color(ch) + 'CC', borderColor: ga4Color(ch), borderWidth: 1,
      data: tDates.map(function(d) { return trendByDateCh[d + '||' + ch] || 0; })
    };
  });

  chartInstances['ga4-sessions-trend'] = new Chart(document.getElementById('ga4-sessions-trend'), {
    type: 'bar',
    data: { labels: tDates.map(function(d) { return d.substring(5); }), datasets: trendDatasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { font: { size: 11 } } } },
      scales: {
        x: { stacked: true, ticks: { maxRotation: 0, font: { size: 10 } } },
        y: { stacked: true, beginAtZero: true }
      }
    }
  });
}

function kpi(label, value, sub, icon) {
  return '<div class="kpi-card"><div class="kpi-label">' + (icon ? icon + ' ' : '') + label + '</div>'
    + '<div class="kpi-value">' + value + '</div>'
    + (sub ? '<div class="kpi-sub">' + sub + '</div>' : '') + '</div>';
}

function renderGA4PagesTable() {
  var pages = ga4FilterData(DATA.ga4LandingPages);
  var L = LANG === 'fr';
  var filter = document.getElementById('ga4-lp-filter');
  var chFilter = filter ? filter.value : '';

  if (chFilter) {
    pages = pages.filter(function(r) { return (r.channel_group || '(Other)') === chFilter; });
  }

  // Aggregate by page (same page can appear multiple times across channels)
  var byPage = {};
  pages.forEach(function(r) {
    var p = r.landing_page || '/';
    if (!byPage[p]) byPage[p] = { sessions: 0, users: 0, conv: 0, rev: 0, bounceW: 0, engW: 0, timeW: 0, w: 0 };
    var s = Number(r.sessions) || 0;
    var b = byPage[p];
    b.sessions += s;
    b.users += Number(r.users) || 0;
    b.conv += Number(r.conversions) || 0;
    b.rev += Number(r.event_revenue) || 0;
    b.bounceW += (Number(r.bounce_rate) || 0) * s;
    b.engW += (Number(r.engagement_rate) || 0) * s;
    b.timeW += (Number(r.avg_engagement_time) || 0) * s;
    b.w += s;
  });

  var pageList = Object.keys(byPage).sort(function(a,b) { return byPage[b].sessions - byPage[a].sessions; });

  var h = '<div class="table-wrap"><table class="data-table"><thead><tr>';
  h += '<th>' + t('ga4Page') + '</th>';
  h += '<th style="text-align:right">' + t('ga4Sessions') + '</th>';
  h += '<th style="text-align:right">' + t('ga4Engagement') + '</th>';
  h += '<th style="text-align:right">' + t('ga4Bounce') + '</th>';
  h += '<th style="text-align:right">' + t('ga4AvgTime') + '</th>';
  h += '<th style="text-align:right">' + t('ga4Conv') + '</th>';
  h += '<th style="text-align:right">' + t('ga4Revenue') + '</th>';
  h += '</tr></thead><tbody>';

  pageList.slice(0, 50).forEach(function(p) {
    var b = byPage[p];
    var eng = b.w > 0 ? (b.engW / b.w * 100).toFixed(1) : '0';
    var bnc = b.w > 0 ? (b.bounceW / b.w * 100).toFixed(1) : '0';
    var avgTime = b.w > 0 ? Math.round(b.timeW / b.w) : 0;
    var engColor = parseFloat(eng) >= 50 ? '#28a745' : (parseFloat(eng) >= 30 ? '#FF8C00' : '#dc3545');
    var bncColor = parseFloat(bnc) <= 40 ? '#28a745' : (parseFloat(bnc) <= 60 ? '#FF8C00' : '#dc3545');

    // Visual bar for engagement
    var engBar = '<div style="display:flex;align-items:center;justify-content:flex-end;gap:6px">'
      + '<div style="width:40px;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden">'
      + '<div style="width:' + Math.min(parseFloat(eng), 100) + '%;height:100%;background:' + engColor + ';border-radius:3px"></div></div>'
      + '<span style="color:' + engColor + ';font-weight:600">' + eng + '%</span></div>';

    // Format time
    var timeStr = avgTime >= 60 ? Math.floor(avgTime / 60) + 'm ' + (avgTime % 60) + 's' : avgTime + 's';

    // Truncate long paths
    var displayPath = p.length > 50 ? p.substring(0, 47) + '...' : p;

    h += '<tr>';
    h += '<td title="' + p.replace(/"/g, '&quot;') + '" style="font-family:monospace;font-size:11px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + displayPath + '</td>';

    h += '<td style="text-align:right">' + engBar + '</td>';
    h += '<td style="text-align:right;color:' + bncColor + '">' + bnc + '%</td>';
    h += '<td style="text-align:right">' + timeStr + '</td>';
    h += '<td style="text-align:right;font-weight:600">' + (b.conv > 0 ? fmt(b.conv) : '—') + '</td>';
    h += '<td style="text-align:right">' + (b.rev > 0 ? fmtCur(b.rev) : '—') + '</td>';
    h += '</tr>';
  });

  h += '</tbody></table></div>';
  if (pageList.length > 50) h += '<p style="text-align:center;color:#94a3b8;font-size:11px;margin-top:8px">' + (L ? 'Top 50 pages affichées sur ' : 'Showing top 50 of ') + pageList.length + '</p>';

  document.getElementById('ga4-lp-table').innerHTML = h;
}

function toggleGlossary() {
  // Remove existing overlay to rebuild with current language
  var existing = document.getElementById('glossary-overlay');
  if (existing && existing.dataset.lang === LANG) { existing.classList.toggle('show'); return; }
  if (existing) existing.remove();
  
  var entries = (GLOSSARY[LANG] || GLOSSARY.en).slice().sort(function(a,b){return a.term.localeCompare(b.term);});
  var html = '<div class="glossary-overlay show" id="glossary-overlay" data-lang="' + LANG + '" onclick="if(event.target===this)this.classList.remove(\'show\')">';
  html += '<div class="glossary-modal"><button class="close-modal" onclick="document.getElementById(\'glossary-overlay\').classList.remove(\'show\')">✕</button>';
  html += '<h2>' + t('glossaryTitle') + '</h2>';
  html += '<input type="text" id="glossary-search" placeholder="' + t('glossarySearch') + '" style="width:100%;padding:8px 12px;border:1px solid #e5e7eb;border-radius:6px;font-size:13px;margin-bottom:12px" oninput="filterGlossary(this.value)">';
  html += '<div id="glossary-list">';
  entries.forEach(function(g) {
    html += '<div class="glossary-item"><div class="glossary-term">' + g.term + '</div><div class="glossary-def">' + g.def + '</div></div>';
  });
  html += '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

function filterGlossary(q) {
  var items = document.querySelectorAll('.glossary-item');
  q = q.toLowerCase();
  items.forEach(function(el) { el.style.display = el.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none'; });
}

// Helper: wrap abbreviations with tooltips
function tip(abbr) {
  var entries = GLOSSARY[LANG] || GLOSSARY.en;
  var entry = entries.find(function(g) { return g.term === abbr; });
  if (!entry) return abbr;
  return '<span class="abbr-tip" data-tip="' + entry.def.replace(/"/g, '&quot;') + '">' + abbr + '</span>';
}
